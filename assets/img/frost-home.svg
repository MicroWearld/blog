<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- 冷墨编辑部 · 首页背景:深墨蓝夜空,右上冰蓝辉光,左上青玉寒光,底部一线极光地平线 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1724"/>
      <stop offset="0.55" stop-color="#131F2E"/>
      <stop offset="1" stop-color="#1B2C41"/>
    </linearGradient>
    <radialGradient id="ice" cx="0.72" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#7FA9D8" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#5D93C9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5D93C9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jade" cx="0.18" cy="0.1" r="0.45">
      <stop offset="0" stop-color="#5FA8A6" stop-opacity="0.12"/>
      <stop offset="0.55" stop-color="#4C9AA0" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#4C9AA0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E5A6E" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#4C8FB0" stop-opacity="0.20"/>
      <stop offset="0.62" stop-color="#5FA8A6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2E5A6E" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- 中央标题带:保持深净,辉光只放两侧与顶端 -->
  <rect width="1600" height="1000" fill="url(#ice)"/>
  <rect width="1600" height="1000" fill="url(#jade)"/>
  <!-- 底部一线寒光(极光地平线),主体细节放 y&gt;880 与两端 -->
  <rect x="0" y="820" width="1600" height="180" fill="url(#aurora)" filter="url(#soft)"/>
  <!-- 稀疏星点,仅上部与两侧 -->
  <g fill="#A9C6E0">
    <circle cx="120" cy="90" r="1.6" opacity="0.5"/>
    <circle cx="330" cy="200" r="1.1" opacity="0.35"/>
    <circle cx="560" cy="80" r="1.3" opacity="0.45"/>
    <circle cx="1060" cy="130" r="1.5" opacity="0.4"/>
    <circle cx="1290" cy="70" r="1.2" opacity="0.5"/>
    <circle cx="1480" cy="230" r="1.6" opacity="0.35"/>
    <circle cx="1520" cy="110" r="1.1" opacity="0.45"/>
    <circle cx="210" cy="330" r="1.0" opacity="0.25"/>
    <circle cx="1440" cy="380" r="1.0" opacity="0.25"/>
  </g>
</svg>
