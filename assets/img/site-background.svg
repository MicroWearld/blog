<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- site-background 精简版:仅保留动态光晕与流动线条,颜色对齐 karin-crimson 主题
       底色与噪点层已移除(透明背景,可叠在任何底色上) -->
  <defs>
    <!-- 光晕 A:主题绯红 #FF2E4D -->
    <radialGradient id="crimson" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF2E4D" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FF2E4D" stop-opacity="0"/>
    </radialGradient>
    <!-- 光晕 B:主题警报蓝 #3A86FF -->
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3A86FF" stop-opacity=".34"/>
      <stop offset="1" stop-color="#3A86FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="60"/></filter>
    <!-- 流动线条:绯红主体 + 粉色高光 + 警报蓝收尾 -->
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#3A86FF" stop-opacity="0"/>
      <stop offset=".45" stop-color="#FF3355" stop-opacity=".6"/>
      <stop offset=".75" stop-color="#FFB3BF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#3A86FF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 动态光晕(慢速漂移) -->
  <g filter="url(#blur)">
    <circle cx="280" cy="160" r="290" fill="url(#crimson)">
      <animate attributeName="cx" values="280;440;280" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;260;160" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1320" cy="690" r="350" fill="url(#blue)">
      <animate attributeName="cx" values="1320;1160;1320" dur="26s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="690;580;690" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="250" r="190" fill="url(#crimson)" opacity=".55">
      <animate attributeName="cy" values="250;390;250" dur="16s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 流动波浪线(形态动画) -->
  <g fill="none" stroke="url(#line)" stroke-width="1.5">
    <path d="M-80 670 C250 420 470 850 770 600 S1320 280 1680 490" opacity=".8"><animate attributeName="d" dur="19s" repeatCount="indefinite" values="M-80 670 C250 420 470 850 770 600 S1320 280 1680 490;M-80 570 C250 720 470 410 770 640 S1320 390 1680 390;M-80 670 C250 420 470 850 770 600 S1320 280 1680 490"/></path>
    <path d="M-60 760 C230 520 500 780 810 690 S1340 420 1660 610" opacity=".65"><animate attributeName="d" dur="24s" repeatCount="indefinite" values="M-60 760 C230 520 500 780 810 690 S1340 420 1660 610;M-60 660 C230 750 500 510 810 730 S1340 330 1660 520;M-60 760 C230 520 500 780 810 690 S1340 420 1660 610"/></path>
  </g>
</svg>
