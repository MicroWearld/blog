# Blowfish 官方推荐的 GitHub Pages 自动部署工作流
# 参考: https://blowfish.page/docs/hosting-deployment/#github-pages
name: GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 显式授予写权限:peaceiris 需要往 gh-pages 分支推送构建产物
# (新仓库默认 token 为 read-only,不加会 403)
permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # 拉取 themes/blowfish 子模块
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.165.0" # 与本地测试版本一致(extended,含 Tailwind)
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
