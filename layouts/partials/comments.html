{{/* giscus 评论(gate:enabled + repo) */}}
{{ if and (site.Params.giscus.enabled | default false) (site.Params.giscus.repo) }}
  <script
    src="https://giscus.app/client.js"
    data-repo="{{ site.Params.giscus.repo }}"
    data-repo-id="{{ site.Params.giscus.repoId }}"
    data-category="{{ site.Params.giscus.category | default "Announcements" }}"
    data-category-id="{{ site.Params.giscus.categoryId }}"
    data-mapping="{{ site.Params.giscus.mapping | default "pathname" }}"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="preferred_color_scheme"
    data-lang="zh-CN"
    crossorigin="anonymous"
    async></script>
{{ else }}
  <p class="pt-2 text-sm text-neutral-500 dark:text-neutral-400">
    评论系统待配置:需要公开的 GitHub 仓库并开启 Discussions(见 config/_default/params.toml 的 [giscus] 段)。
  </p>
{{ end }}
