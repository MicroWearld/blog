  <!-- 副标题 -->
  <text x="600" y="556" text-anchor="middle" font-family="Noto Serif SC, Source Han Serif SC, Songti SC, SimSun, serif" font-size="24" fill="#9A8F7E" letter-spacing="6">学习记录 · 项目工作 · 个人随笔</text>
