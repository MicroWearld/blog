# 评论系统(giscus,基于 GitHub Discussions)
# 启用步骤:1) 博客仓库设为公开 2) 仓库开启 Discussions 3) 在 giscus.app 生成 repoId/categoryId 4) 取消注释并填入
[giscus]
  enabled = true
  repo = "MicroWearld/blog"
  repoId = "R_kgDOUN5-tA"
  category = "Announcements"
  categoryId = "DIC_kwDOUN5-tM4DE17F"
  mapping = "pathname"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "top"
  lang = "zh-CN"
  loading = "lazy"
